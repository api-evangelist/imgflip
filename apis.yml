aid: imgflip
name: Imgflip
description: Imgflip is a meme generator platform providing a REST API for captioning
  popular meme templates, searching over one million meme formats, auto-generating
  memes from text input, and creating original AI-powered meme images. Free endpoints
  cover getting popular templates and captioning images; premium endpoints unlock GIF
  captioning, meme search, automeme, and AI meme generation.
